<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        input {
            display: block;
            margin-bottom: 10px;
            padding: 5px;
        }

        button {
            padding: 5px 15px;
            cursor: pointer;
        }

        li {
            margin-bottom: 10px;
        }

        .erro {
            color: red;
        }

        .sucesso {
            color: green;
        }
    </style>
</head>
<body>

    <h1>Cadastro de Alunos</h1>
    
    <form id="formulario" novalidate>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>

        <label for="email">E-mail:</label>
        <input type="email" id="email" required>

        <label for="ra">Registro Acadêmico (6 números):</label>
        <input type="text" id="ra" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>

        <!-- Input do telefone com validação para começar com 9 após o DDD -->
        <label for="telefone">Telefone (DDD + 9 seguido de 8 números, ex: 11988887777):</label>
        <input type="text" id="telefone" inputmode="numeric" pattern="[0-9]{2}9[0-9]{8}" maxlength="11" required>

        <button type="submit">Enviar</button>
    </form>

    <p id="mensagem" aria-live="polite"></p>

    <h2>Alunos Cadastrados</h2>
    <ol id="listaAlunos"></ol>

    <script>
        // Array que armazena os cadastros enquanto a página está aberta
        let alunos = [];

        const formulario = document.getElementById("formulario");
        const lista = document.getElementById("listaAlunos");
        const mensagem = document.getElementById("mensagem");
        const emailCampo = document.getElementById("email");
        const raCampo = document.getElementById("ra");
        const telefoneCampo = document.getElementById("telefone");

        formulario.addEventListener("submit", function(event) {
            // Evita que o formulário recarregue a página
            event.preventDefault();

            // Lê os valores digitados e remove espaços das extremidades
            let nome = document.getElementById("nome").value.trim();
            let email = emailCampo.value.trim();
            let ra = raCampo.value.trim();
            let telefone = telefoneCampo.value.trim();

            // Verifica os dados antes de cadastrar
            if (nome === "" || email === "" || ra === "" || telefone === "") {
                mensagem.textContent = "Erro: preencha todos os campos.";
                mensagem.className = "erro";
            } else if (nome.length < 3) {
                mensagem.textContent = "Erro: o nome deve ter pelo menos 3 caracteres.";
                mensagem.className = "erro";
            } else if (!emailCampo.checkValidity()) {
                mensagem.textContent = "Erro: digite um e-mail válido.";
                mensagem.className = "erro";
            } else if (!raCampo.checkValidity()) {
                mensagem.textContent = "Erro: o RA deve conter exatamente 6 números.";
                mensagem.className = "erro";
            } else if (!telefoneCampo.checkValidity()) {
                mensagem.textContent = "Erro: o telefone deve conter o DDD seguido de 9 e mais 8 dígitos (ex: 11988887777).";
                mensagem.className = "erro";
            } else {
                // Só chega aqui quando todos os dados são válidos
                let aluno = {
                    nome: nome,
                    email: email,
                    ra: ra,
                    telefone: telefone
                };

                alunos.push(aluno);

                // Adiciona o cadastro à lista ordenada no HTML
                let item = document.createElement("li");
                item.textContent = nome + " - " + email + " - RA: " + ra + " - Tel: " + telefone;
                lista.appendChild(item);

                mensagem.textContent = "Aluno cadastrado com sucesso!";
                mensagem.className = "sucesso";

                console.log(alunos);
                formulario.reset();
            }
        });
    </script>

</body>
</html>
